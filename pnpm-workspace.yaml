packages:
  - "docs"
# pnpm 11 runs a dependency-status check (which itself invokes `pnpm install`)
# before every script. When native build scripts are pending approval this
# check fails and aborts the script. Disable it so doc/lib builds run cleanly.
verifyDepsBeforeRun: false
# Approve native build scripts so they are not "ignored" (CI treats ignored
# builds as a fatal error). esbuild is used by tsup/vite; sharp is pulled in
# transitively by astro for image optimization.
onlyBuiltDependencies:
  - esbuild
  - sharp
minimumReleaseAgeExclude:
  - "@astrojs/compiler@0.3.1"
  - "@astrojs/compiler-binding@0.3.1"
  - "@astrojs/compiler-binding-darwin-arm64@0.3.1"
  - "@astrojs/compiler-binding-darwin-x64@0.3.1"
  - "@astrojs/compiler-binding-linux-arm64-gnu@0.3.1"
  - "@astrojs/compiler-binding-linux-arm64-musl@0.3.1"
  - "@astrojs/compiler-binding-linux-x64-gnu@0.3.1"
  - "@astrojs/compiler-binding-linux-x64-musl@0.3.1"
  - "@astrojs/compiler-binding-wasm32-wasi@0.3.1"
  - "@astrojs/compiler-binding-win32-arm64-msvc@0.3.1"
  - "@astrojs/compiler-binding-win32-x64-msvc@0.3.1"
  - "@astrojs/compiler-rs@0.3.1"
  - "@ungap/structured-clone@1.3.3"
  - klinecharts@10.0.1
allowBuilds:
  esbuild: true
  sharp: true
